# Pub workspace root: `dart pub get` here resolves every package below.
# Nothing is published from this directory; see packages/*.
name: tessera_workspace
publish_to: none

environment:
  sdk: ^3.13.3

workspace:
  - packages/tessera
  - packages/tessera_flutter
  - packages/tessera_flutter/example
  - packages/tessera_xlsx
  - packages/tessera_ods
  - packages/tessera_html
