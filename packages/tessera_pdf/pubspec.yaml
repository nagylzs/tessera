name: tessera_pdf
description: "PDF export for the tessera pivot-table engine: paginated pages with repeated headers, fit-to-width or tiling, themed with CubeExportTheme. Pure Dart, built on package:pdf."
version: 0.2.0
repository: https://github.com/nagylzs/tessera/tree/main/packages/tessera_pdf
issue_tracker: https://github.com/nagylzs/tessera/issues
topics:
  - pivot-table
  - pdf
  - export
  - report
resolution: workspace

environment:
  sdk: ^3.13.3

dependencies:
  pdf: ^3.11.0
  tessera: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
