name: tessera_flutter
description: "Flutter widgets for the tessera pivot-table engine: an expandable cube grid, axis and aggregate editors, and localizations for fourteen languages."
version: 0.1.1
repository: https://github.com/nagylzs/tessera/tree/main/packages/tessera_flutter
issue_tracker: https://github.com/nagylzs/tessera/issues
screenshots:
  - description: CubeView showing sales by region and country against year and quarter, with Europe and 2024 expanded and a selected cell.
    path: doc/cube_view.png
topics:
  - pivot-table
  - olap
  - aggregation
  - widgets
  - data-grid
resolution: workspace

